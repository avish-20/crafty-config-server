server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/craftly-intelligence-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  ai:
    openai:
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: gpt-4
          temperature: 0.0

---
spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.craftly-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}

  ai:
    openai:
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: gpt-4

---

spring:
  config:
    activate:
      on-profile: k8s
  data:
    redis:
      host: redis.craftly-core.svc.cluster.local
      port: 6379

minio:
  url: http://minio.craftly-core.svc.cluster.local:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  project-bucket: projects
